# Copy this file to your repository at:
# .github/workflows/nix-builder.yml
#
# This workflow sets up on-demand distributed Nix remote builders using
# the reusable workflow from dweee/Nix_Remote-Builders-Distributed.
#
# Keep this repository private: builders receive your derivations' sources.
#
# Optional cache configuration comes from repository variables and secrets:
#   vars.NIX_SUBSTITUTERS          extra substituters (space-separated)
#   vars.NIX_TRUSTED_PUBLIC_KEYS   their public keys (space-separated)
#   vars.ATTIC_ENDPOINT            Attic server, e.g. https://attic.example.com
#   vars.ATTIC_CACHE               Attic cache name
#   vars.ATTIC_SUBSTITUTER         optional; resolved from the server when unset
#   vars.ATTIC_PUBLIC_KEY          optional; resolved from the server when unset
#   vars.ATTIC_PUSH_ENABLED        set to "false" to substitute without pushing
#   vars.NIX_PUSH_TO               generic `nix copy --to` store URI
#   secrets.ATTIC_TOKEN            Attic token (pull + push)
#   secrets.NIX_NETRC              netrc for other authenticated substituters
#   secrets.NIX_SIGNING_KEY        signs paths before NIX_PUSH_TO copies

name: "Nix Remote Builder"
run-name: "${{ inputs.target != '' && format('Nix Remote: {0} [{1}]', inputs.target, inputs.session_id) || format('Nix Remote: [{0}]', inputs.session_id) }}"

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Unique session identifier"
        required: true
        type: string
      target:
        description: "Target or Nix command being executed"
        type: string
        default: ""
      matrix:
        description: "JSON matrix specification ({ include: [...] })"
        required: true
        type: string
      environment:
        description: "GitHub Actions environment name to source secrets from (optional)"
        type: string
        default: ""
      tailscale_tags:
        description: "Tailscale ACL tags to apply to runner nodes (optional)"
        type: string
        default: "tag:nix-builder"
      timeout_startup:
        description: "Timeout in seconds to wait for initial Tailscale connection (0 to disable)"
        type: number
        default: 300
      timeout_idle:
        description: "Timeout in seconds of inactivity before runner disconnects (0 to disable)"
        type: number
        default: 300
      timeout_linger:
        description: "Timeout in seconds to keep runner alive after build completes (0 to disable)"
        type: number
        default: 0

jobs:
  remote-builder:
    name: "Remote Builder Dispatch"
    permissions:
      id-token: write
      contents: read
    uses: dweee/Nix_Remote-Builders-Distributed/.github/workflows/nix-builder.yml@main
    with:
      # Optional: specify a GitHub Actions Environment name if your Tailscale
      # secrets (OAuth or OIDC) are stored within an Environment
      # (e.g. "Nix Builders" or your custom env name).
      # If using standard Repository Secrets, set this to "" or omit this line.
      environment: ${{ inputs.environment != '' && inputs.environment || '' }}
      tailscale_tags: ${{ inputs.tailscale_tags }}
      matrix: ${{ inputs.matrix }}
      session_id: ${{ inputs.session_id }}
      target: ${{ inputs.target }}
      timeout_startup: ${{ inputs.timeout_startup != '' && format('{0}', inputs.timeout_startup) || '300' }}
      timeout_idle: ${{ inputs.timeout_idle != '' && format('{0}', inputs.timeout_idle) || '300' }}
      timeout_linger: ${{ inputs.timeout_linger != '' && format('{0}', inputs.timeout_linger) || '0' }}
      substituters: ${{ vars.NIX_SUBSTITUTERS }}
      trusted_public_keys: ${{ vars.NIX_TRUSTED_PUBLIC_KEYS }}
      attic_server: ${{ vars.ATTIC_ENDPOINT }}
      attic_cache: ${{ vars.ATTIC_CACHE }}
      attic_substituter: ${{ vars.ATTIC_SUBSTITUTER }}
      attic_public_key: ${{ vars.ATTIC_PUBLIC_KEY }}
      attic_push: ${{ vars.ATTIC_PUSH_ENABLED != 'false' && 'true' || 'false' }}
      push_to: ${{ vars.NIX_PUSH_TO }}
    secrets: inherit
