name: "Nix Remote Builder"
run-name: "${{ inputs.target != '' && format('Nix Remote: {0} [{1}]', inputs.target, inputs.session_id) || format('Nix Remote: [{0}]', inputs.session_id) }}"

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Unique session identifier"
        required: true
        type: string
      target:
        description: "Target or Nix command being executed"
        type: string
        default: ""
      matrix:
        description: "JSON matrix specification ({ include: [...] })"
        required: true
        type: string
      environment:
        description: "GitHub Actions environment name to source secrets from (optional)"
        type: string
        default: ""
      tailscale_tags:
        description: "Tailscale ACL tags to apply to runner nodes"
        default: "tag:nix-builder"
        type: string
      timeout_startup:
        description: "Wait for first connection in seconds"
        default: "300"
        type: string
      timeout_idle:
        description: "Idle timeout between disconnections in seconds"
        default: "300"
        type: string
      timeout_linger:
        description: "Grace period after completion signal in seconds"
        default: "0"
        type: string

  workflow_call:
    inputs:
      session_id:
        description: "Unique session identifier"
        required: true
        type: string
      target:
        description: "Target or Nix command being executed"
        type: string
        default: ""
      matrix:
        description: "JSON matrix specification ({ include: [...] })"
        required: true
        type: string
      environment:
        description: "GitHub Actions environment name to source secrets from (optional)"
        type: string
        default: ""
      tailscale_tags:
        description: "Tailscale ACL tags to apply to runner nodes"
        default: "tag:nix-builder"
        type: string
      timeout_startup:
        description: "Wait for first connection in seconds"
        default: "300"
        type: string
      timeout_idle:
        description: "Idle timeout between disconnections in seconds"
        default: "300"
        type: string
      timeout_linger:
        description: "Grace period after completion signal in seconds"
        default: "0"
        type: string

      # Substitution: lets the builders fetch dependencies from caches instead
      # of rebuilding them or receiving them from the client.
      substituters:
        description: "Space-separated extra substituter URLs for the builders"
        type: string
        default: ""
      trusted_public_keys:
        description: "Space-separated extra trusted public keys for the builders"
        type: string
        default: ""
      extra_nix_conf:
        description: "Extra lines appended to the builders' nix.conf"
        type: string
        default: ""
      magic_nix_cache:
        description: "Use the GitHub Actions cache through Magic Nix Cache"
        type: string
        default: "true"

      # Attic: used as a substituter and as the push target.
      attic_server:
        description: "Attic server endpoint (e.g. https://attic.example.com)"
        type: string
        default: ""
      attic_cache:
        description: "Attic cache name"
        type: string
        default: ""
      attic_substituter:
        description: "Attic substituter URL (resolved from the server when empty)"
        type: string
        default: ""
      attic_public_key:
        description: "Attic cache public key (resolved from the server when empty)"
        type: string
        default: ""
      attic_substitute:
        description: "Add the Attic cache to the builders' substituters"
        type: string
        default: "true"
      attic_push:
        description: "Push outputs built on the builders to the Attic cache"
        type: string
        default: "true"

      # Generic binary cache push through `nix copy`.
      push_to:
        description: "Nix store URI to copy built outputs to (e.g. s3://bucket?region=..., ssh-ng://host)"
        type: string
        default: ""
      push_paths:
        description: "Which paths to push: 'built' (outputs built on the builder) or 'all' (every path added during the session)"
        type: string
        default: "built"

      # Public runner repositories: keep metadata out of logs and run history.
      purge_runs:
        description: "Delete this workflow's earlier completed runs (needs `actions: write` from the caller)"
        type: string
        default: "false"
      verbose_logs:
        description: "Print per-path output when a cache push fails"
        type: string
        default: "false"
    secrets:
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth Client ID"
        required: false
      TS_OAUTH_SECRET:
        description: "Tailscale OAuth Client Secret (for OAuth authentication)"
        required: false
      TS_AUDIENCE:
        description: "Tailscale OIDC Audience (for Workload Identity Federation)"
        required: false
      ATTIC_TOKEN:
        description: "Attic token (pull for substitution, push for uploads)"
        required: false
      NIX_NETRC:
        description: "netrc contents for authenticated substituters"
        required: false
      # Cache settings as secrets keep them out of the run's "Inputs" log
      # block in a public repository (GitHub masks secrets everywhere).
      # Each is used when the matching `with:` input is empty.
      NIX_SUBSTITUTERS:
        description: "Extra substituter URLs (space-separated); alternative to the `substituters` input"
        required: false
      NIX_TRUSTED_PUBLIC_KEYS:
        description: "Extra trusted public keys (space-separated); alternative to `trusted_public_keys`"
        required: false
      ATTIC_ENDPOINT:
        description: "Attic server endpoint; alternative to `attic_server`"
        required: false
      ATTIC_CACHE:
        description: "Attic cache name; alternative to `attic_cache`"
        required: false
      ATTIC_SUBSTITUTER:
        description: "Attic substituter URL; alternative to `attic_substituter`"
        required: false
      ATTIC_PUBLIC_KEY:
        description: "Attic cache public key; alternative to `attic_public_key`"
        required: false
      NIX_PUSH_TO:
        description: "Store URI for `nix copy --to`; alternative to `push_to`"
        required: false
      NIX_SIGNING_KEY:
        description: "Nix secret signing key applied before `push_to` copies"
        required: false
      AWS_ACCESS_KEY_ID:
        description: "S3 access key for an s3:// `push_to` store"
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: "S3 secret key for an s3:// `push_to` store"
        required: false

jobs:
  purge:
    name: "Purge earlier runs"
    if: ${{ inputs.purge_runs == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: "Delete completed runs"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id")
          count=0
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && count=$((count + 1))
          done
          echo "Deleted ${count} earlier run(s)."

  builder:
    name: "Nix Builder: ${{ matrix.id }}"
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      # Masks apply to every later line of this job, including other actions'
      # output, so cache URLs and keys never appear in (public) logs.
      - name: "Mask configuration"
        shell: bash
        env:
          VALUES: >-
            ${{ inputs.substituters || secrets.NIX_SUBSTITUTERS }} ${{ inputs.trusted_public_keys || secrets.NIX_TRUSTED_PUBLIC_KEYS }}
            ${{ inputs.attic_server || secrets.ATTIC_ENDPOINT }} ${{ inputs.attic_substituter || secrets.ATTIC_SUBSTITUTER }}
            ${{ inputs.attic_public_key || secrets.ATTIC_PUBLIC_KEY }} ${{ inputs.push_to || secrets.NIX_PUSH_TO }}
          ATTIC_SERVER: ${{ inputs.attic_server || secrets.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ inputs.attic_cache || secrets.ATTIC_CACHE }}
        run: |
          mask() { [ -n "$1" ] && echo "::add-mask::$1"; return 0; }
          for v in $VALUES; do
            mask "$v"
            mask "$(sed -E 's#^[a-z0-9+]+://([^/:?]+).*#\1#' <<<"$v")"
          done
          mask "${ATTIC_SERVER%/}"
          mask "$ATTIC_CACHE"

      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Checkout pinned builder helpers"
        uses: actions/checkout@v7
        with:
          repository: dweee/Nix_Remote-Builders-Distributed
          # github.job_workflow_sha is an OIDC claim, not a GitHub context field.
          # Pin the helpers independently because reusable workflows run in the
          # caller's checkout and github.sha refers to the caller's revision.
          ref: b597c7b894abd3b36520d467bd20aa11aea88033
          path: .nix-remote-src
          sparse-checkout: |
            .github/actions/probe-gccarch
            .github/scripts

      - name: "Probe CPU architectures"
        id: gccarch
        shell: bash
        run: |
          set -euo pipefail
          features=$(bash .nix-remote-src/.github/actions/probe-gccarch/probe-gccarch.sh | head -n 1)
          mkdir -p "$HOME/.config/nix-remote"
          printf '%s\n' "$features" > "$HOME/.config/nix-remote/gccarch"
          echo "features=$features" >> "$GITHUB_OUTPUT"
          if [ -n "$features" ]; then
            echo "gccarch features: $features"
          else
            echo "No gccarch features beyond the stock baseline."
          fi

      - name: "Resolve substituters"
        id: nix-conf
        shell: bash
        env:
          SUBSTITUTERS: ${{ inputs.substituters || secrets.NIX_SUBSTITUTERS }}
          TRUSTED_PUBLIC_KEYS: ${{ inputs.trusted_public_keys || secrets.NIX_TRUSTED_PUBLIC_KEYS }}
          EXTRA_NIX_CONF: ${{ inputs.extra_nix_conf }}
          GCCARCH: ${{ steps.gccarch.outputs.features }}
          ATTIC_SERVER: ${{ inputs.attic_server || secrets.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ inputs.attic_cache || secrets.ATTIC_CACHE }}
          ATTIC_SUBSTITUTER: ${{ inputs.attic_substituter || secrets.ATTIC_SUBSTITUTER }}
          ATTIC_PUBLIC_KEY: ${{ inputs.attic_public_key || secrets.ATTIC_PUBLIC_KEY }}
          ATTIC_SUBSTITUTE: ${{ inputs.attic_substitute }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          NIX_NETRC: ${{ secrets.NIX_NETRC }}
        run: |
          set -euo pipefail

          substituters="$SUBSTITUTERS"
          keys="$TRUSTED_PUBLIC_KEYS"
          netrc_dir="$RUNNER_TEMP/nix-remote"
          netrc="$netrc_dir/netrc"
          mkdir -p "$netrc_dir"
          chmod 700 "$netrc_dir"
          ( umask 077 && : > "$netrc" )

          if [ -n "$NIX_NETRC" ]; then
            printf '%s\n' "$NIX_NETRC" >> "$netrc"
          fi

          if [ "$ATTIC_SUBSTITUTE" != "false" ] && [ -n "$ATTIC_SERVER" ] && [ -n "$ATTIC_CACHE" ]; then
            server="${ATTIC_SERVER%/}"
            sub="$ATTIC_SUBSTITUTER"
            key="$ATTIC_PUBLIC_KEY"
            if [ -z "$sub" ] || [ -z "$key" ]; then
              auth=()
              if [ -n "$ATTIC_TOKEN" ]; then
                auth=(-H "Authorization: Bearer $ATTIC_TOKEN")
              fi
              if ! cfg=$(curl -fsSL --retry 3 "${auth[@]}" "$server/_api/v1/cache-config/$ATTIC_CACHE"); then
                echo "::error::Could not read the Attic cache configuration. Provide ATTIC_TOKEN, or set attic_substituter and attic_public_key."
                exit 1
              fi
              sub="${sub:-$(jq -r '.substituter_endpoint // empty' <<<"$cfg")}"
              key="${key:-$(jq -r '.public_key // empty' <<<"$cfg")}"
            fi
            if [ -z "$sub" ] || [ -z "$key" ]; then
              echo "::error::Could not resolve the Attic substituter or public key."
              exit 1
            fi
            echo "::add-mask::$sub"
            echo "::add-mask::$key"
            substituters="$substituters $sub"
            keys="$keys $key"

            if [ -n "$ATTIC_TOKEN" ]; then
              host=$(sed -E 's#^[a-z]+://([^/:]+).*#\1#' <<<"$sub")
              printf 'machine %s\npassword %s\n' "$host" "$ATTIC_TOKEN" >> "$netrc"
            fi
          fi

          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "conf<<$delim"
            # trim leading/trailing whitespace from the space-separated lists
            substituters=$(xargs <<<"$substituters")
            keys=$(xargs <<<"$keys")
            if [ -n "$substituters" ]; then echo "extra-substituters = $substituters"; fi
            if [ -n "$keys" ]; then echo "extra-trusted-public-keys = $keys"; fi
            if [ -n "$EXTRA_NIX_CONF" ]; then printf '%s\n' "$EXTRA_NIX_CONF"; fi
            if [ -n "$GCCARCH" ]; then echo "extra-system-features = $GCCARCH"; fi
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          count=$(wc -w <<<"$substituters")
          echo "Configured ${count} extra substituter(s)."

      - name: "Setup Nix"
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          extra-conf: ${{ steps.nix-conf.outputs.conf }}
          source-tag: v3.24.1
          # This repository deliberately suppresses builder metadata in public runs.
          summarize: false

      - name: "Verify Determinate Nix"
        shell: bash
        run: |
          set -euo pipefail
          version=$(nix --version)
          case "$version" in
            *"Determinate Nix 3.24.1"*) ;;
            *) echo "::error::Expected Determinate Nix 3.24.1, got $version"; exit 1 ;;
          esac
          # Exercise the daemon store instead of merely checking the client binary.
          nix store info --store daemon --json > "$RUNNER_TEMP/nix-remote/daemon-info.json"
          determinate-nixd version

      - name: "Configure private daemon cache credentials"
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/nix-remote/netrc" ]; then
            sudo bash .nix-remote-src/.github/scripts/setup-private-daemon.sh \
              "$RUNNER_TEMP/nix-remote/netrc" \
              .nix-remote-src/.github/scripts/refresh-private-netrc.pl
            nix store info --store daemon --json > /dev/null
          fi

      - name: "Setup Magic Nix Cache"
        if: ${{ inputs.magic_nix_cache != 'false' }}
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: "Snapshot store"
        shell: bash
        run: |
          nix path-info --all > "$RUNNER_TEMP/nix-remote/store-before"
          echo "Store holds $(wc -l < "$RUNNER_TEMP/nix-remote/store-before") paths before the session."

      - name: "Connect Tailscale with SSH"
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ inputs.tailscale_tags }}
          hostname: "nix-builder-${{ inputs.session_id }}-${{ matrix.id }}"
          args: "--ssh"

      - name: "Watchdog: Connection & Idle Lifecycle"
        shell: bash
        run: |
          TIMEOUT_STARTUP="${{ inputs.timeout_startup }}"
          TIMEOUT_IDLE="${{ inputs.timeout_idle }}"
          TIMEOUT_LINGER="${{ inputs.timeout_linger }}"

          INTERVAL=10
          IDLE_SECS=0
          CONNECTED_ONCE=false
          SIGNAL_FILE="/tmp/nix-builder-done"

          echo "Builder ready on Tailnet (Tailscale SSH enabled)!"
          echo "Watchdog config: startup=${TIMEOUT_STARTUP}s, idle=${TIMEOUT_IDLE}s, linger=${TIMEOUT_LINGER}s"

          while true; do
            # Explicit completion signal received
            if [ -f "$SIGNAL_FILE" ]; then
              if [ "$TIMEOUT_LINGER" -gt 0 ]; then
                echo "Completion signal received. Lingering for ${TIMEOUT_LINGER}s..."
                sleep "$TIMEOUT_LINGER"
              else
                echo "Completion signal received. Exiting immediately."
              fi
              break
            fi

            # Check active SSH sessions (ss on Linux, lsof on macOS)
            if command -v ss >/dev/null 2>&1; then
              ACTIVE_SSH=$(ss -H -t state established '( sport = :22 )' 2>/dev/null | wc -l || true)
            elif command -v lsof >/dev/null 2>&1; then
              ACTIVE_SSH=$(lsof -iTCP:22 -sTCP:ESTABLISHED 2>/dev/null | sed 1d | wc -l || true)
            else
              ACTIVE_SSH=0
            fi
            ACTIVE_NIX=$(pgrep -f "nix-daemon" 2>/dev/null | wc -l || true)

            if [ "$ACTIVE_SSH" -gt 0 ] || [ "$ACTIVE_NIX" -gt 0 ]; then
              if [ "$CONNECTED_ONCE" = false ]; then
                echo "First client connected! Startup window satisfied."
                CONNECTED_ONCE=true
              elif [ "$IDLE_SECS" -gt 0 ]; then
                echo "Connection restored! Resetting idle timer."
              fi
              IDLE_SECS=0
            else
              IDLE_SECS=$(( IDLE_SECS + INTERVAL ))

              if [ "$CONNECTED_ONCE" = false ]; then
                CURRENT_LIMIT="$TIMEOUT_STARTUP"
                PHASE="startup connection"
              else
                CURRENT_LIMIT="$TIMEOUT_IDLE"
                PHASE="idle reconnection"
              fi

              REMAINING=$(( CURRENT_LIMIT - IDLE_SECS ))
              if [ $(( IDLE_SECS % 60 )) -eq 0 ] || [ "$IDLE_SECS" -eq "$INTERVAL" ]; then
                echo "Waiting for ${PHASE} (idle: ${IDLE_SECS}s / ${CURRENT_LIMIT}s, remaining: ${REMAINING}s)..."
              fi

              if [ "$CURRENT_LIMIT" -gt 0 ] && [ "$IDLE_SECS" -ge "$CURRENT_LIMIT" ]; then
                echo "Timeout of ${CURRENT_LIMIT}s exceeded during ${PHASE}. Terminating builder."
                break
              fi
            fi

            sleep "$INTERVAL"
          done

          echo "Builder session ended cleanly."

      - name: "Push to binary cache"
        if: ${{ always() }}
        shell: bash
        env:
          PUSH_PATHS: ${{ inputs.push_paths }}
          ATTIC_SERVER: ${{ inputs.attic_push != 'false' && (inputs.attic_server || secrets.ATTIC_ENDPOINT) || '' }}
          ATTIC_CACHE: ${{ inputs.attic_cache || secrets.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          PUSH_TO: ${{ inputs.push_to || secrets.NIX_PUSH_TO }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          VERBOSE_LOGS: ${{ inputs.verbose_logs }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if { [ -z "$ATTIC_SERVER" ] || [ -z "$ATTIC_CACHE" ]; } && [ -z "$PUSH_TO" ]; then
            echo "No cache push configured."
            exit 0
          fi
          work="$RUNNER_TEMP/nix-remote"
          before="$work/store-before"
          paths="$work/push-paths"
          log="$work/push.log"

          if [ ! -f "$before" ]; then
            echo "No store snapshot was taken; nothing to push."
            exit 0
          fi

          # Paths that appeared during the session. 'built' keeps build outputs:
          # ones this builder produced ("ultimate"), or unsigned paths with a
          # deriver (built elsewhere, not substituted). Plain sources are skipped.
          nix path-info --all | sort > "$work/store-after"
          sort "$before" | comm -13 - "$work/store-after" | grep -v '\.drv$' > "$work/new-paths" || true

          case "$PUSH_PATHS" in
            all)
              cp "$work/new-paths" "$paths"
              ;;
            built)
              if [ -s "$work/new-paths" ]; then
                json_format=()
                if nix path-info --help 2>/dev/null | grep -q -- '--json-format'; then
                  json_format=(--json-format 1)
                fi
                xargs nix path-info --json "${json_format[@]}" < "$work/new-paths" \
                  | jq -r 'def built: .ultimate == true
                             or (((.signatures // []) | length) == 0 and .deriver != null);
                           if type == "array"
                           then .[] | select(built) | .path
                           else to_entries[] | select(.value | built) | .key end' \
                  > "$paths"
              else
                : > "$paths"
              fi
              ;;
            *)
              echo "::error::push_paths must be 'built' or 'all', got '$PUSH_PATHS'."
              exit 1
              ;;
          esac

          count=$(wc -l < "$paths" | tr -d ' ')
          echo "Selected ${count} path(s) to push (mode: $PUSH_PATHS)."
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          # Per-path output stays in a log file; it is shown on failure only
          # with verbose_logs, since it names store paths.
          fail() {
            echo "::error::$1"
            if [ "$VERBOSE_LOGS" = "true" ]; then
              tail -n 40 "$log" || true
            fi
            exit 1
          }

          if [ -n "$ATTIC_SERVER" ]; then
            attic_bin=$(nix build --no-link --print-out-paths nixpkgs#attic-client)/bin/attic
            "$attic_bin" login nix-remote "${ATTIC_SERVER%/}" "$ATTIC_TOKEN" > "$log" 2>&1 \
              || fail "attic login failed"
            xargs "$attic_bin" push "nix-remote:$ATTIC_CACHE" < "$paths" >> "$log" 2>&1 \
              || fail "attic push failed"
            echo "Pushed ${count} path(s) and their closures to Attic."
          fi

          if [ -n "$PUSH_TO" ]; then
            if [ -n "$NIX_SIGNING_KEY" ]; then
              key_file="$work/signing-key"
              ( umask 077 && printf '%s\n' "$NIX_SIGNING_KEY" > "$key_file" )
              xargs nix store sign --recursive --key-file "$key_file" < "$paths" >> "$log" 2>&1 \
                || fail "nix store sign failed"
              rm -f "$key_file"
            fi
            xargs nix copy --to "$PUSH_TO" < "$paths" >> "$log" 2>&1 \
              || fail "nix copy failed"
            echo "Copied ${count} path(s) and their closures to the push_to store."
          fi
