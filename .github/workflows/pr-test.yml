name: PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Syntax-check the builder scripts
        run: |
          for script in .github/scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile .github/scripts/*.py
          perl -c .github/scripts/refresh-private-netrc.pl
      - name: Test OIDC publication and refreshing daemon reads
        run: |
          python3 .github/scripts/test-push-niks3.py
          python3 .github/scripts/test-niks3-reader.py
          python3 .github/scripts/test-session-completion.py
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          source-tag: v3.24.1
          summarize: false
      - name: Test session publication dispatch without network access
        run: nix shell --inputs-from . nixpkgs#nushell -c python3 .github/scripts/test-session-publication.py
