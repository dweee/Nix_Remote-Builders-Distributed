name: PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Syntax-check the builder scripts
        run: |
          for script in .github/scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile .github/scripts/*.py
          perl -c .github/scripts/refresh-private-netrc.pl
