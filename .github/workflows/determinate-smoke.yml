name: Determinate Nix smoke test
on:
  pull_request:
    paths:
      - .github/workflows/nix-builder.yml
      - .github/workflows/determinate-smoke.yml
      - .github/scripts/test-determinate-cache.py
      - .github/scripts/setup-private-daemon.sh
      - .github/scripts/refresh-private-netrc.pl
      - .github/scripts/test-darwin-wrapper.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          source-tag: v3.24.1
          summarize: false
      - name: Make Nix daemon available to macOS SSH sessions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          daemon=/usr/local/bin/nix-daemon
          if [ ! -e "$daemon" ]; then
            sudo ln -s /nix/var/nix/profiles/default/bin/nix-daemon "$daemon"
          fi
          test -x "$daemon"
          env -i PATH=/usr/local/bin:/usr/bin:/bin /bin/bash -c 'command -v nix-daemon'

      - name: Check client, daemon and evaluation
        shell: bash
        run: |
          set -euo pipefail
          nix --version | grep -F 'Determinate Nix 3.24.1'
          determinate-nixd version
          nix store info --store daemon --json
          test "$(nix eval --raw --expr 'builtins.toString (1 + 1)')" = 2
      - name: Configure daemon-only synthetic cache credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'machine 127.0.0.1 login ci password synthetic-read-only\n' > "$RUNNER_TEMP/synthetic.netrc"
          sudo bash .github/scripts/setup-private-daemon.sh "$RUNNER_TEMP/synthetic.netrc" .github/scripts/refresh-private-netrc.pl
          if test -r /nix/var/nix/nix-remote-private/combined.netrc; then
            echo 'Private daemon netrc is readable by the job user.' >&2
            exit 1
          fi
          nix store info --store daemon --json > /dev/null
      - name: Check authenticated daemon substitution
        run: python3 .github/scripts/test-determinate-cache.py
      - name: Check launchd exec wrapper with authenticated daemon substitution
        if: runner.os == 'macOS'
        run: sudo -E bash .github/scripts/test-darwin-wrapper.sh
